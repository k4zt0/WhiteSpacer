model_name: inclusionAI/Ling-3.0-tiny
tokenizer_name: inclusionAI/Ling-3.0-tiny
base_runtime: Edge0/Edge0-8B-A1B-preview
dataset_path: data/balanced/train.jsonl
eval_dataset_path: data/balanced/validation.jsonl
output_dir: outputs/WhiteSpacer-quality
max_seq_length: 1024
learning_rate: 0.00002
num_train_epochs: 1
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 2
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 5
eval_steps: 200
save_steps: 100
save_total_limit: 2
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_a_proj
  - q_b_proj
  - kv_a_proj_with_mqa
  - kv_b_proj
  - o_proj
seed: 42
gradient_checkpointing: false
group_by_length: true
dataloader_num_workers: 4

