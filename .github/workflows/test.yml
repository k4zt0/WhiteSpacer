name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install "requests>=2.32,<3" "pytest>=8,<9"
      - run: python -m compileall -q train.py evaluate.py publish.py scripts tests
      - run: pytest -q

